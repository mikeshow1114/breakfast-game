<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a0a00">
<title>早安小老闆</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;
    overflow:hidden;
    background:#000;
    font-family:'Noto Sans TC',sans-serif;
    position:fixed;
    touch-action:none;
  }
  #game-container{
    width:100%;height:100%;
    display:flex;justify-content:center;align-items:center;
  }
  /* DOM UI overlay (login / modal) */
  #ui-overlay{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:100;
  }
  #ui-overlay.interactive{ pointer-events:all; }

/* Login card (DOM, shown before Phaser loads) */
#login-screen{
position:fixed;inset:0;
background:linear-gradient(160deg,#0d0600 0%,#1f0c00 60%,#0d0600 100%);
display:none;justify-content:center;align-items:center;
z-index:200;overflow-y:auto;
transition:opacity .4s ease;
}

.login-card{
background:rgba(255,248,220,.06);
border:1px solid rgba(245,158,11,.3);
border-radius:20px;
padding:28px 24px;
width:min(360px,calc(100% - 32px));
box-shadow:0 0 60px rgba(245,158,11,.15),0 20px 40px rgba(0,0,0,.6);
backdrop-filter:blur(20px);
}
.logo-wrap{text-align:center;margin-bottom:24px}
.logo-emoji{
font-size:3rem;display:block;margin-bottom:8px;
animation:logoBob 1.2s ease infinite alternate;
filter:drop-shadow(0 0 12px rgba(245,158,11,.8));
}
@keyframes logoBob{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-8px) rotate(4deg)}}
.logo-title{
font-size:1.8rem;font-weight:900;
background:linear-gradient(135deg,#fbbf24,#f97316,#fbbf24);
background-size:200% auto;
-webkit-background-clip:text;-webkit-text-fill-color:transparent;
animation:shine 3s linear infinite;
font-family:‘Fredoka One’,cursive;
text-shadow:none;
}
@keyframes shine{to{background-position:200% center}}
.logo-sub{color:#d97706;font-size:.8rem;margin-top:4px}

.tabs{display:flex;background:rgba(0,0,0,.3);border-radius:10px;padding:3px;margin-bottom:16px}
.tab-btn{flex:1;padding:9px;border:none;background:transparent;color:#9ca3af;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:700;transition:.2s;min-height:40px}
.tab-btn.active{background:linear-gradient(135deg,#f59e0b,#f97316);color:white}
.tab-pane{display:none}.tab-pane.active{display:block}

.field{margin-bottom:12px}
.field label{display:block;color:#fbbf24;font-size:.76rem;margin-bottom:4px;font-weight:700}
.field input{
width:100%;padding:11px 13px;
background:rgba(0,0,0,.4);border:1px solid rgba(251,191,36,.35);
border-radius:10px;color:white;font-family:inherit;font-size:.9rem;
outline:none;-webkit-appearance:none;min-height:44px;
transition:.2s;
}
.field input:focus{border-color:#f59e0b;background:rgba(0,0,0,.6)}
.field input::placeholder{color:#6b7280}

.btn-glow{
width:100%;padding:13px;margin-top:4px;
background:linear-gradient(135deg,#f59e0b,#f97316);
border:none;border-radius:12px;color:white;font-weight:900;
font-size:.95rem;cursor:pointer;font-family:inherit;min-height:48px;
box-shadow:0 0 20px rgba(249,115,22,.5),0 4px 12px rgba(0,0,0,.4);
transition:.2s;letter-spacing:.5px;
}
.btn-glow:active{transform:scale(.97);box-shadow:0 0 10px rgba(249,115,22,.4)}
.divider{text-align:center;margin:14px 0;position:relative;color:#6b7280;font-size:.8rem}
.divider::before,.divider::after{content:’’;position:absolute;top:50%;width:38%;height:1px;background:rgba(255,255,255,.1)}
.divider::before{left:0}.divider::after{right:0}
.btn-fb{
width:100%;padding:12px;background:#1877f2;border:none;border-radius:12px;
color:white;font-weight:700;font-size:.88rem;cursor:pointer;font-family:inherit;
display:flex;align-items:center;justify-content:center;gap:10px;min-height:44px;
transition:.2s;
}
.btn-fb:active{background:#1464d8;transform:scale(.97)}
.demo-note{text-align:center;margin-top:12px;color:#6b7280;font-size:.72rem;padding:8px;border:1px dashed rgba(245,158,11,.2);border-radius:8px}

/* Loading bar */
#loading-screen{
position:fixed;inset:0;background:#000;
display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;
z-index:300;transition:opacity .4s ease;
}
.load-icon{font-size:3rem;animation:logoBob 1s ease infinite alternate;filter:drop-shadow(0 0 20px #f97316)}
.load-title{color:#fbbf24;font-size:1.2rem;font-weight:900;font-family:‘Fredoka One’,cursive}
.load-bar-wrap{width:200px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;border:1px solid rgba(245,158,11,.3)}
.load-bar{height:100%;background:linear-gradient(90deg,#f59e0b,#f97316);border-radius:3px;transition:width .3s ease;width:0%}
.load-text{color:#6b7280;font-size:.78rem}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>

<!-- Loading Screen -->

<div id="loading-screen">
  <div class="load-icon">🍳</div>
  <div class="load-title">早安小老闆</div>
  <div class="load-bar-wrap"><div class="load-bar" id="load-bar"></div></div>
  <div class="load-text" id="load-text">載入遊戲引擎...</div>
</div>

<!-- Login Screen (DOM) -->

<div id="login-screen" class="hidden">
  <div class="login-card">
    <div class="logo-wrap">
      <span class="logo-emoji">🍳</span>
      <div class="logo-title">早安小老闆</div>
      <div class="logo-sub">從一間早餐店，征服全台灣</div>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchLoginTab('login')">登入</button>
      <button class="tab-btn" onclick="switchLoginTab('register')">註冊</button>
    </div>
    <div id="pane-login" class="tab-pane active">
      <div class="field"><label>📧 信箱</label><input type="email" id="li-email" placeholder="your@email.com"></div>
      <div class="field"><label>🔒 密碼</label><input type="password" id="li-pass" placeholder="••••••••"></div>
      <button class="btn-glow" onclick="doLogin()">🚀 開始賺錢！</button>
      <div class="divider">或</div>
      <button class="btn-fb" onclick="doFBLogin()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3z"/></svg>
        Facebook 登入
      </button>
    </div>
    <div id="pane-register" class="tab-pane">
      <div class="field"><label>👤 暱稱</label><input type="text" id="rg-name" placeholder="小老闆的名字"></div>
      <div class="field"><label>📧 信箱</label><input type="email" id="rg-email" placeholder="your@email.com"></div>
      <div class="field"><label>🔒 密碼</label><input type="password" id="rg-pass" placeholder="至少6字元"></div>
      <button class="btn-glow" onclick="doRegister()">✨ 創建帳號</button>
    </div>
    <div class="demo-note">💡 直接點「開始賺錢」可快速體驗</div>
  </div>
</div>

<!-- Phaser Canvas Container -->

<div id="game-container"></div>
<!-- DOM UI Overlay for Phaser -->
<div id="ui-overlay"></div>

<!-- Phaser 3 -->

<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>

<script src="game.js"></script>

</body>
</html>
